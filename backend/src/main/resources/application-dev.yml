spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tiesverse_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dev-client-id
            client-secret: dev-client-secret

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

logging:
  level:
    com.tiesverse: DEBUG
    org.springframework.security: DEBUG
