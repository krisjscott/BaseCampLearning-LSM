spring:
  datasource:

    url: ${DB_URL:jdbc:postgresql://localhost:5432/basecamp}
    username: ${DB_USERNAME:basecamp}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:unconfigured-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:unconfigured-google-client-secret}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

management:
  health:
    # Redis/RabbitMQ/SMTP aren't run locally and nothing in the app actually
    # uses them yet (see README known limitations) - without this, their
    # auto-detected health indicators drag /actuator/health to DOWN even
    # though the API and database are fine, which is what the admin
    # dashboard's "API health" card reports.
    redis:
      enabled: false
    rabbit:
      enabled: false
    mail:
      enabled: false

logging:
  level:
    com.tiesverse: DEBUG
    org.springframework.security: DEBUG
