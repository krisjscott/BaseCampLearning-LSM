spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:60000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:600000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      connection-timeout: 30000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-prod
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

logging:
  level:
    com.tiesverse: INFO
    org.springframework.security: WARN

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3100}
  cors:
    # CORS_ALLOWED_ORIGINS is the canonical name. Keep the legacy typo as a
    # fallback so existing deployments do not silently lose their allowlist.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${CORS_PUBLIC_API_URL:}}
  bootstrap-admin:
    email: ${INITIAL_ADMIN_EMAIL:}
    password: ${INITIAL_ADMIN_PASSWORD:}
    full-name: ${INITIAL_ADMIN_FULL_NAME:Platform Administrator}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
