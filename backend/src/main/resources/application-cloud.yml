server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:60000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:600000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      connection-timeout: 30000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-prod
    baseline-on-migrate: true
    validate-on-migrate: true

  cache:
    type: simple

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false
    mail:
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: 604800000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  bootstrap-admin:
    email: ${INITIAL_ADMIN_EMAIL:}
    password: ${INITIAL_ADMIN_PASSWORD:}
    full-name: ${INITIAL_ADMIN_FULL_NAME:Platform Administrator}
  video:
    base-url: ${VIDEO_BASE_URL:}
