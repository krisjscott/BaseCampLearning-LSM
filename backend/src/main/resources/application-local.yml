server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${LOCAL_DB_URL:jdbc:h2:file:./data/basecamp-local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${LOCAL_DB_USERNAME:sa}
    password: ${LOCAL_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/local
    baseline-on-migrate: true
    validate-on-migrate: false
  cache:
    type: simple
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false
    mail:
      enabled: false

jwt:
  secret: ${JWT_SECRET:VGhpcy1pcy1hLWJhc2VjYW1wLWxvY2FsLWRldi1zZWNyZXQta2V5LTMyLWJ5dGVzLWxvbmc=}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
