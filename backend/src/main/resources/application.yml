spring:
  application:
    name: tiesverse-basecamp-learning
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    out-of-order: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:unconfigured-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:unconfigured-google-client-secret}
            scope: [openid,profile,email]

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:200MB}
      max-request-size: ${MAX_UPLOAD_SIZE:200MB}

server:
  port: ${SERVER_PORT:8081}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3100}
  password-reset-url: ${PASSWORD_RESET_URL:${FRONTEND_URL:http://localhost:3100}/recover-access}
  storage:
    root: ${STORAGE_ROOT:./uploads}

r2:
  endpoint: ${R2_ENDPOINT:}
  bucket: ${R2_BUCKET:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

turnstile:
  secret-key: ${TURNSTILE_SECRET:}
  enabled: ${TURNSTILE_ENABLED:}

# ROOT LEVEL ACTUATOR CONFIGURATION
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true